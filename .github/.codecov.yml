# Codecov configuration
# Reference: https://docs.codecov.io/docs/codecov-yaml
codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "80...100"

  status:
    # Overall project coverage (combines all flagged uploads)
    project:
      default:
        # "auto" = ratchet: never allow overall coverage to decrease
        target: auto
        threshold: 1%
        if_ci_failed: error
        flags:
          - unit
          - integration
          - e2e

      # Unit tests coverage target
      unit:
        target: auto
        threshold: 1%
        flags:
          - unit

      # Integration tests coverage target
      integration:
        target: 70%
        threshold: 5%
        flags:
          - integration

      # E2E / UI tests coverage target
      e2e:
        target: 70%
        threshold: 5%
        flags:
          - e2e

    # Per-patch (changed lines) coverage — ensures new code is tested
    patch:
      default:
        target: 90%
        threshold: 5%

# Flag definitions for different test suites
flags:
  unit:
    paths:
      - services/
      - server/
      - lib/
      - cli/
      - types/
    carryforward: true

  integration:
    paths:
      - services/
      - server/
      - lib/
      - cli/
    carryforward: true

  e2e:
    paths:
      - components/
      - hooks/
      - lib/
    carryforward: true

comment:
  layout: "reach,diff,flags,components"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/__mocks__/**"
  - "playwright-report/**"
  - "coverage/**"
  - "docs/**"
  - "scripts/**"
  - "deployment/**"
  - "cli/demo/**"
  - "observio-sample-agent/**"

# Component-level coverage breakdown shown in PR comments
component_management:
  individual_components:
    - component_id: server
      name: Backend (Server)
      paths:
        - server/**
    - component_id: services
      name: Services
      paths:
        - services/**
    - component_id: cli
      name: CLI
      paths:
        - cli/**
    - component_id: ui
      name: UI Components
      paths:
        - components/**
        - hooks/**
    - component_id: lib
      name: Shared Libraries
      paths:
        - lib/**
        - types/**
