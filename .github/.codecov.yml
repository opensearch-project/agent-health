# Codecov configuration
# Reference: https://docs.codecov.io/docs/codecov-yaml
codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "80...100"

  status:
    # Overall project coverage
    project:
      default:
        target: 90%
        threshold: 2%
        if_ci_failed: error

      # Unit tests coverage target
      unit:
        target: 90%
        threshold: 2%
        flags:
          - unit

      # Integration tests coverage target
      integration:
        target: 70%
        threshold: 5%
        flags:
          - integration

      # E2E / UI tests coverage target
      e2e:
        target: 50%
        threshold: 5%
        flags:
          - e2e

    # Per-patch (changed lines) coverage
    patch:
      default:
        target: 90%
        threshold: 2%

# Flag definitions for different test suites
flags:
  unit:
    paths:
      - services/
      - server/
      - lib/
      - cli/
      - types/
    carryforward: true

  integration:
    paths:
      - services/
      - server/
      - lib/
    carryforward: true

  e2e:
    paths:
      - components/
      - hooks/
      - lib/
    carryforward: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/__mocks__/**"
  - "playwright-report/**"
  - "coverage/**"
  - "docs/**"
  - "observio-sample-agent/**"
