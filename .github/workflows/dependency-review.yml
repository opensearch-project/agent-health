name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          allow-licenses: Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, CC-BY-4.0, BlueOak-1.0.0, Python-2.0
          # protobufjs is BSD-3-Clause but GitHub reports a compound SPDX expression
          # that includes a scanner artifact for bundled protobuf definitions.
          # bowser uses "MIT AND MITNFA" (compound), json-schema-typed uses "BSD-2-Clause AND JSON" —
          # both are transitive deps of observio-sample-agent and use permissive licenses.
          # strtok3@10.3.5 is MIT (see node_modules/strtok3/LICENSE.txt + package.json "license":"MIT"),
          # but GitHub's license-metadata DB reports a stale compound "MIT AND Ruby" for this version.
          # It arrives transitively via @mariozechner/pi-coding-agent -> file-type -> strtok3 (agent judge).
          allow-dependencies-licenses: 'pkg:npm/protobufjs, pkg:npm/bowser, pkg:npm/json-schema-typed, pkg:npm/strtok3'
