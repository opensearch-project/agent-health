name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, CC-BY-4.0, BlueOak-1.0.0, Python-2.0
          # protobufjs is BSD-3-Clause but GitHub reports a compound SPDX expression
          # that includes a scanner artifact for bundled protobuf definitions.
          # bowser uses "MIT AND MITNFA" (compound), json-schema-typed uses "BSD-2-Clause AND JSON" —
          # both are transitive deps of observio-sample-agent and use permissive licenses.
          allow-dependencies-licenses: 'pkg:npm/protobufjs, pkg:npm/bowser, pkg:npm/json-schema-typed'
